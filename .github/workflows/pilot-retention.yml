name: Evolv pilot retention

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete expired pilot data
        env:
          PILOT_CRON_SECRET: ${{ secrets.EVOLV_PILOT_CRON_SECRET }}
        run: |
          test -n "$PILOT_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $PILOT_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://zaqbnznrfvapbgrjxskv.supabase.co/functions/v1/pilot-retention
